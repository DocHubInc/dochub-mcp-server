name: Bug report
description: The connector doesn't connect, or a DocHub action fails
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Security issues don't belong here.** Report vulnerabilities privately via [private vulnerability reporting](https://github.com/DocHubInc/dochub-mcp-server/security/advisories/new).
        >
        > 🔒 **Keep your data private.** Never paste access tokens or the contents of your documents. Sharing a document ID is fine — sharing what's inside the document is not.

        If the problem is that a **generated document came out wrong** (content, layout, formatting), please use the [Generation feedback](https://github.com/DocHubInc/dochub-mcp-server/issues/new?template=generation_feedback.yml) form instead — it asks the right questions for that.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I tried disconnecting and reconnecting the DocHub connector, and the problem is still there
        - label: (ChatGPT only) I checked that the DocHub connector is turned on in the chat where I'm using it
        - label: I searched existing issues and didn't find this problem
          required: true
  - type: dropdown
    id: client
    attributes:
      label: Where are you using the connector?
      options:
        - Claude (claude.ai in the browser)
        - Claude (desktop app)
        - ChatGPT
        - Other (mention it below)
    validations:
      required: true
  - type: dropdown
    id: problem-type
    attributes:
      label: What kind of problem is it?
      options:
        - I can't connect or authorize the connector
        - A DocHub action fails with an error
        - The connector or its tools don't show up at all
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What did you ask, and what went wrong?
      description: You won't see raw error logs — that's fine. Tell us what you asked the assistant to do, and what it said when it failed.
      placeholder: |
        I asked: "Show me my recent documents"
        The assistant said: "I wasn't able to reach DocHub — the request was not authorized."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Can you make it happen again?
      description: If you found a reliable way to trigger the problem, list the steps here.
    validations:
      required: false
  - type: input
    id: when
    attributes:
      label: When did it happen?
      description: An approximate date and time with your timezone helps us find it in our logs.
      placeholder: e.g. 2026-07-16 around 14:30, New York time
    validations:
      required: false
